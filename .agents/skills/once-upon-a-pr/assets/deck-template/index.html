<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Once Upon a PR 🧚</title>
  <link rel="icon" type="image/svg+xml" href="vendor/brand/book-spark.svg">
  <link rel="stylesheet" href="vendor/diff2html/diff2html.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="deck-header">
    <div class="deck-identity">
      <span class="brand-lockup">
        <img class="brand-mark" src="vendor/brand/book-spark.svg" width="36" height="36" alt="">
        <span class="deck-brand"><em>Once Upon</em> a PR</span>
      </span>
      <span class="deck-title" id="deckTitle">A walkthrough of the change</span>
    </div>
    <div class="deck-progress">
      <span class="frac" aria-live="polite" aria-atomic="true"><span id="slideIndex">1</span><span class="frac-divider">/</span><span id="slideTotal">1</span></span>
      <div class="bar" id="progressBar" role="progressbar" aria-label="Slide progress" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1">
        <div class="bar-fill" id="barFill"></div>
      </div>
    </div>
  </header>

  <main id="slides">
    <!-- SLIDES -->
  </main>

  <nav class="deck-nav" aria-label="Slide navigation">
    <span class="footer-signature"><span aria-hidden="true">✦</span> A change, told clearly.</span>
    <span class="kbd-hint">Use <kbd>←</kbd> <kbd>→</kbd> to move through the story</span>
    <div class="nav-buttons">
      <button id="prevBtn" class="nav-btn" aria-label="Previous slide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
      </button>
      <button id="nextBtn" class="nav-btn" aria-label="Next slide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>
      </button>
    </div>
  </nav>

  <script id="manifest" type="application/json">
    <!-- MANIFEST -->
  </script>
  <script src="vendor/diff2html/diff2html-ui.min.js"></script>
  <script src="deck.js"></script>
</body>
</html>
