<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tell Me a PR</title>
  <link rel="stylesheet" href="vendor/diff2html/diff2html.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="deck-header">
    <span class="deck-title" id="deckTitle">Tell Me a PR</span>
    <div class="deck-progress">
      <span class="frac"><span id="slideIndex">1</span> / <span id="slideTotal">1</span></span>
      <div class="bar" id="progressBar">
        <svg class="bar-sketch" aria-hidden="true"></svg>
        <div class="bar-fill" id="barFill"></div>
      </div>
    </div>
  </header>

  <main id="slides">
    <!-- SLIDES -->
  </main>

  <nav class="deck-nav" aria-label="Slide navigation">
    <div class="kbd-hint" id="kbdHint">
      <svg class="kbd-frame" aria-hidden="true"></svg>
      <span class="kbd-caption">
        <span class="kbd-glyph" aria-hidden="true">&#9000;</span>
        <span class="kbd-keys">&#9664;&nbsp;&#9654;</span>
        <span class="kbd-text">to navigate</span>
      </span>
    </div>
    <div class="nav-buttons">
      <button id="prevBtn" class="nav-btn" aria-label="Previous slide">
        <svg class="nav-sketch" aria-hidden="true"></svg>
        <span class="nav-arrow">&#9664;</span>
      </button>
      <button id="nextBtn" class="nav-btn" aria-label="Next slide">
        <svg class="nav-sketch" aria-hidden="true"></svg>
        <span class="nav-arrow">&#9654;</span>
      </button>
    </div>
  </nav>

  <script id="manifest" type="application/json">
    <!-- MANIFEST -->
  </script>
  <script src="vendor/roughjs/rough.umd.js"></script>
  <script src="vendor/diff2html/diff2html-ui.min.js"></script>
  <script src="deck.js"></script>
</body>
</html>
